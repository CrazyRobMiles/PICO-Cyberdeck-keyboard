<text x="20" y="595" fill="#222"><tspan font-weight="bold" fill="#1f5fbf">Rows (outputs):</tspan> all held high; the firmware drives one row low at a time.</text>
<text x="20" y="614" fill="#222"><tspan font-weight="bold" fill="#c0392b">Columns (inputs):</tspan> pulled up inside the Pico, so they read high unless a key pulls them low.</text>
<text x="20" y="633" fill="#222"><tspan font-weight="bold" fill="#222">A pressed key</tspan> joins its column to its row through its diode (anode on the column side),</text>
<text x="20" y="652" fill="#222"><tspan font-weight="bold" fill="#222"></tspan> so the column reads low only while that key's row is driven low: row + column = the key.</text>
<text x="20" y="671" fill="#222"><tspan font-weight="bold" fill="#222">The diodes</tspan> stop current flowing back through other pressed keys, so there are no ghost keys.</text>
</svg>
